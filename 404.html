<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Вадим Черенёв</title>
<meta name="robots" content="noindex">
<style>
:root { --bg:#0b0e14; --surface:#12161f; --text:#c9d1d9; --dim:#8b949e; --nixie:#d4a24e; --scope:#57d98f;
  --mono: ui-monospace,"JetBrains Mono",SFMono-Regular,Menlo,Consolas,monospace; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
  color: var(--text); font-family: system-ui,-apple-system,"Segoe UI",Roboto,"PT Sans",sans-serif;
  line-height: 1.6; text-align: center; padding: 0 1.5rem; }
p { margin: 0 0 1rem; }
.mono { font-family: var(--mono); color: var(--nixie); letter-spacing: 0.08em; }
h1 { margin: 0 0 0.6rem; font-size: clamp(1.6rem, 5vw, 2.4rem); color: #e6edf3; }
a { color: var(--scope); text-decoration: none; }
a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <p class="mono">// [404] обрыв дорожки</p>
  <h1>Страница не найдена</h1>
  <p>Такого тут нет — видимо, не взлетело.</p>
  <p class="mono"><a href="/antilanding/">← на главную</a></p>
</main>
</body>
</html>
